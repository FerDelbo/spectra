name: 🚀 Deploy via SSH (VPS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Obter código
      uses: actions/checkout@v4

    - name: 📡 Executar comandos no VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.FTP_SERVER }}      
        username: ${{ secrets.FTP_USER }} 
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22022
        script_stop: true
        script: |
          cd /home/wwutiu/utiusys.com.br/GTX1650/public_html/spectra_1.1
          git pull origin main || (git init && git remote add origin https://github.com/FerDelbo/spectra.git && git pull origin main)
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py collectstatic --noinput
          python manage.py migrate
          mkdir -p tmp
          touch tmp/restart.txt
          
          echo "✅ Deploy Finalizado com Sucesso!"
